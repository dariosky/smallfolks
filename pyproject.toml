[project]
name = "smallfolk"
version = "0.1.0"
description = "A calm, inspectable city-life simulation."
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.116.0",
    "google-auth[requests]>=2.40.0",
    "itsdangerous>=2.2.0",
    "psycopg2-binary>=2.9.10",
    "pydantic[email]>=2.11.0",
    "python-dotenv>=1.1.0",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.24",
    "uvicorn[standard]>=0.35.0",
    "setproctitle>=1.3.6",
]

[dependency-groups]
dev = [
    "bandit[toml]>=1.8.6",
    "httpx>=0.28.0",
    "pre-commit>=4.2.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.1.0",
    "ruff>=0.12.0",
]

[tool.pytest.ini_options]
addopts = []
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["backend"]
omit = [
    "*/migrations/*",
    "backend/run_dev.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = ["*/tests/*", ".venv"]
skips = ["B110"]

[tool.ruff]
src = ["backend"]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
